name: Тесты

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: Проверка Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
