# Скопируйте файл в config.toml. Локальная копия игнорируется Git.

[jira]
base_url = "https://jira.example.invalid"
api_path = "/rest/api/2"
token_env = "JIRA_TOKEN"
proxy = ""
ca_bundle = ""
verify_tls = true
timeout_seconds = 30
page_size = 100

# Перед отправкой JQL в Jira коллектор заменяет {period_days}.
# Настройте полный запрос в локальном файле config.toml.
jql = "project = PROJECT_KEY AND (created >= -{period_days}d OR updated >= -{period_days}d OR statusCategory != Done) ORDER BY updated DESC"
period_days = 10

# Здесь можно указывать стандартные имена и идентификаторы полей Jira.
fields = [
  "summary",
  "description",
  "status",
  "priority",
  "created",
  "updated",
  "resolutiondate",
  "assignee",
  "reporter",
  "components",
  "labels",
  "issuelinks",
  "security",
]

[output]
directory = "output"
json_filename = "jira_tickets.json"
csv_filename = "jira_tickets.csv"
